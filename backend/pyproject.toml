[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic~=1.19.0",
    "asyncpg~=0.31.0",
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.52.1",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ruff~=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
# Auto-generated by `alembic revision`; keep it in Alembic's own format.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
